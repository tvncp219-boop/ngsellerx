<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NG SELLER X</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--ice:#eaf2ff;--mut:#9fb0d0;--aqua:#5ee7df;--coral:#ff7a90;--g:rgba(255,255,255,.07);--b:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ice);font:400 15px/1.5 Sora,system-ui,sans-serif}
body{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 64px) 14px calc(env(safe-area-inset-bottom,0px) + 84px);
background:radial-gradient(circle at 15% 10%,#2b1a6b 0,transparent 40%),radial-gradient(circle at 90% 30%,#0b5d66 0,transparent 38%),radial-gradient(circle at 40% 95%,#6b1a3d 0,transparent 40%),var(--bg);background-attachment:fixed}
.glass{background:var(--g);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--b);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.35)}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:rgba(7,11,26,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px}.logo i{font-style:normal;color:var(--aqua)}
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;display:flex;padding:6px;border-radius:26px}
nav a{flex:1;text-align:center;padding:9px 2px;border-radius:20px;color:var(--mut);text-decoration:none;font-size:12px;font-weight:600}
nav a.on{background:rgba(94,231,223,.18);color:var(--aqua)}
main{max-width:640px;margin:0 auto;display:grid;gap:12px}
h1{font-size:30px;line-height:1.1;font-weight:800}h2{font-size:20px}h3{font-size:18px}
p,small{color:var(--mut)}small{font-size:12px}
.hero{padding:20px}.hero p{margin-top:8px}
.tabs{display:flex;gap:8px}
.tabs button,.btn,.ghost{font:600 14px Sora,sans-serif;border:0;border-radius:16px;padding:11px 16px;cursor:pointer;color:var(--ice)}
.tabs button{flex:1;background:var(--g);border:1px solid var(--b)}
.tabs button.on{background:rgba(94,231,223,.2);color:var(--aqua);border-color:var(--aqua)}
.btn{background:linear-gradient(135deg,var(--aqua),#6b8bff);color:#04121c}
.btn:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:var(--g);border:1px solid var(--b)}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.card{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.card .btn{grid-column:1/-1}
.pr{font-size:24px;font-weight:800}
.st{font-size:11px;padding:3px 9px;border-radius:99px;margin-left:8px;font-weight:600}
.in{background:rgba(94,231,223,.18);color:var(--aqua)}.out{background:rgba(255,122,144,.18);color:var(--coral)}
.r{text-align:right}
input,select,textarea{width:100%;font:400 15px Sora,sans-serif;color:var(--ice);background:rgba(255,255,255,.08);border:1px solid var(--b);border-radius:14px;padding:11px 13px;margin:6px 0}
.box{padding:16px;display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
#modal{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,16,.7)}
#modal.on{display:flex}
.sheet{width:100%;max-width:380px;max-height:92vh;overflow:auto;padding:20px;display:grid;gap:10px;text-align:center;background:rgba(20,26,56,.85)}
.sheet img{width:200px;max-width:100%;margin:0 auto;border-radius:14px;background:#fff}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:10;padding:10px 16px;border-radius:99px;background:var(--aqua);color:#04121c;font-weight:600;display:none}
a{color:var(--aqua)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<header><div class="logo">NG SELLER <i>X</i></div><div id="auth"></div></header>
<main id="app"></main>
<nav class="glass" id="nav"></nav>
<div id="modal"></div><div id="toast"></div>

const APPEAL_PRICE=499;
// Edit these prices to your own
const TOPUP=[["115 Diamonds",90],["240 Diamonds",180],["610 Diamonds",450],["Weekly membership",160],["Monthly membership",800]];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={user:null,ids:[],orders:[],all:[],reviews:[],tier:"prime",pay:null};
const isAdmin=()=>S.user&&S.user.email===ADMIN;
let unsubs=[];
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}

const pages={
ids(){
 const list=S.ids.filter(x=>x.tier===S.tier).sort((a,b)=>a.price-b.price);
 return `<section class="glass hero"><h1>Free Fire IDs, checked before you pay</h1><p>15-day guarantee on every ID. Order status and proof stay in your account.</p></section>
 <div class="tabs"><button data-act="tier" data-t="prime" class="${S.tier==="prime"?"on":""}">Prime Level 8</button><button data-act="tier" data-t="normal" class="${S.tier==="normal"?"on":""}">Normal</button></div>
 ${list.map(x=>`<div class="glass card"><div><b>${esc(x.name)}</b><br><small>${x.tier==="prime"?"Prime Level 8":"Normal quality"}</small></div><div class="r"><span class="pr">₹${esc(x.price)}</span><span class="st ${x.stock?"in":"out"}">${x.stock?"In stock":"Sold"}</span></div><button class="btn" data-act="buy" data-id="${x.id}" ${x.stock?"":"disabled"}>Buy this ID</button></div>`).join("")||`<div class="glass box"><b>No IDs here yet</b><small>New IDs are added soon. Check back later.</small></div>`}`;
},
topup(){
 return `<section class="glass hero"><h2>Top-up</h2><p>Done within 30 minutes or you get a refund.</p></section>
 <div class="glass box"><label>Your Free Fire UID<input id="ffuid" inputmode="numeric" placeholder="Enter UID"></label></div>
 ${TOPUP.map((t,i)=>`<div class="glass card"><b>${esc(t[0])}</b><div class="r"><span class="pr">₹${t[1]}</span><span class="st in">In stock</span></div><button class="btn" data-act="buyx" data-k="Top-up" data-i="${i}">Order</button></div>`).join("")}`;
},
appeal(){
 return `<section class="glass hero"><h2>ID Unban Appeal</h2><p>We submit your UID appeal to Garena. If the ID is not unbanned within 7 days you get a refund, and you receive a screenshot of the unbanned ID as proof.</p></section>
 <div class="glass box"><label>Banned UID<input id="ffuid" inputmode="numeric" placeholder="Enter UID"></label><div class="pr">₹${APPEAL_PRICE}</div><button class="btn" data-act="buyx" data-k="Unban Appeal">Pay and send proof</button></div>`;
},
orders(){
 if(!S.user)return `<div class="glass box"><b>Log in to see your orders</b><button class="btn" data-act="login">Log in with Google</button></div>`;
 const o=[...S.orders].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 return `<h2>My orders</h2>${o.map(x=>`<div class="glass card"><div><b>${esc(x.title)}</b><br><small>${esc(x.type)}${x.ffuid?" · UID "+esc(x.ffuid):""}</small></div><div class="r"><b>₹${esc(x.price)}</b><br><span class="st ${x.status==="rejected"?"out":"in"}">${{pending:"Checking payment",delivered:"Delivered",rejected:"Rejected"}[x.status]||esc(x.status)}</span></div></div>`).join("")||`<div class="glass box"><small>No orders yet.</small></div>`}`;
},
reviews(){
 return `<h2>Customer reviews</h2>
 <div class="glass box"><select id="rt"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><textarea id="rx" rows="2" maxlength="280" placeholder="Write your review"></textarea><button class="btn" data-act="review">Post review</button></div>
 ${S.reviews.map(r=>`<div class="glass box"><b>${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</b><span>${esc(r.text)}</span><small>${esc(r.name)}</small></div>`).join("")}`;
},
admin(){
 if(!isAdmin())return `<div class="glass box"><b>Admin only</b><small>Log in with the owner account.</small></div>`;
 const o=[...S.all].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 return `<h2>Admin</h2>
 <div class="glass box"><b>Add ID</b><input id="an" placeholder="ID name"><input id="ap" type="number" placeholder="Price"><select id="at"><option value="prime">Prime Level 8</option><option value="normal">Normal</option></select><div class="row"><button class="btn" data-act="addid">Add ID</button><button class="ghost" data-act="seed">Add 8 sample Normal IDs</button></div></div>
 <div class="glass box"><b>IDs</b>${S.ids.map(x=>`<div class="row"><span style="flex:1">${esc(x.name)} · ₹${esc(x.price)} · ${esc(x.tier)}</span><button class="ghost" data-act="stock" data-id="${x.id}">${x.stock?"Mark sold":"Mark in stock"}</button><button class="ghost" data-act="del" data-id="${x.id}">Delete</button></div>`).join("")||"<small>No IDs</small>"}</div>
 <div class="glass box"><b>Orders</b>${o.map(x=>`<div class="glass box"><b>${esc(x.title)} · ₹${esc(x.price)}</b><small>${esc(x.email)} · ${esc(x.type)} ${x.ffuid?"· UID "+esc(x.ffuid):""} · ${esc(x.status)}</small><img src="${esc(x.proof)}" alt="Payment proof" style="max-width:100%;border-radius:12px">
<div class="row"><button class="btn" data-act="status" data-id="${x.id}" data-s="delivered">Delivered</button><button class="ghost" data-act="status" data-id="${x.id}" data-s="rejected">Reject</button></div></div>`).join("")||"<small>No orders</small>"}</div>`;
}};

function render(){
 if(!S.user){
  $("#nav").style.display="none";$("#auth").innerHTML="";
  $("#app").innerHTML=`<section class="glass hero" style="margin-top:12vh;text-align:center"><h1>NG SELLER <span style="color:var(--aqua)">X</span></h1><p>Sign up or log in with your Gmail account to open the store.</p><button class="btn" style="margin-top:18px;width:100%" data-act="login">Continue with Google</button><p style="margin-top:12px"><small>One tap. Your orders and payment proofs stay in your account.</small></p></section>`;
  return;
 }
 $("#nav").style.display="";
 const p=(location.hash||"#ids").slice(1);const pg=pages[p]?p:"ids";
 $("#app").innerHTML=pages[pg]();
 const tabs=[["ids","IDs"],["topup","Top-up"],["appeal","Appeal"],["orders","Orders"],["reviews","Reviews"]];
 if(isAdmin())tabs.push(["admin","Admin"]);
 $("#nav").innerHTML=tabs.map(t=>`<a href="#${t[0]}" class="${t[0]===pg?"on":""}">${t[1]}</a>`).join("");
 $("#auth").innerHTML=S.user?`<button class="ghost" data-act="logout">Log out</button>`:`<button class="btn" data-act="login">Log in</button>`;
}
window.addEventListener("hashchange",render);

/* Live data */
onAuthStateChanged(auth,u=>{
 S.user=u;unsubs.forEach(f=>f());unsubs=[];S.orders=[];S.all=[];S.ids=[];S.reviews=[];
 if(u){
  unsubs.push(onSnapshot(collection(db,"ids"),s=>{S.ids=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  unsubs.push(onSnapshot(query(collection(db,"reviews"),orderBy("createdAt","desc"),limit(30)),s=>{S.reviews=s.docs.map(d=>d.data());render()}));
  unsubs.push(onSnapshot(query(collection(db,"orders"),where("uid","==",u.uid)),s=>{S.orders=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  if(u.email===ADMIN)unsubs.push(onSnapshot(collection(db,"orders"),s=>{S.all=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
 }
 render();
});

/* Payment sheet */
function openPay(p){
 if(!S.user){toast("Log in first");return}
 S.pay=p;
 $("#modal").innerHTML=`<div class="glass sheet"><h3>Pay ₹${esc(p.price)}</h3><p>${esc(p.title)}</p><img src="${QR}" alt="UPI QR code"><small>Scan with any UPI app, pay the exact amount, then upload the screenshot.</small><input type="file" id="proof" accept="image/*"><button class="btn" data-act="send">Send proof</button><button class="ghost" data-act="close">Close</button></div>`;
 $("#modal").classList.add("on");
}
const closePay=()=>{$("#modal").classList.remove("on");$("#modal").innerHTML=""};

/* Shrinks the screenshot so it fits inside a Firestore document (no Storage needed) */
function shrink(file){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6))};im.onerror=no;im.src=URL.createObjectURL(file)})}

/* Actions */
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,d=b.dataset;
 try{
 if(a==="login")await signInWithPopup(auth,new GoogleAuthProvider());
 else if(a==="logout")await signOut(auth);
 else if(a==="tier"){S.tier=d.t;render()}
 else if(a==="buy"){const x=S.ids.find(i=>i.id===d.id);if(x)openPay({type:"ID",title:x.name,price:x.price,itemId:x.id})}
 else if(a==="buyx"){
  const uid=($("#ffuid")?.value||"").trim();
  if(!/^\d{6,14}$/.test(uid)){toast("Enter a valid UID");return}
  if(d.k==="Top-up"){const t=TOPUP[+d.i];openPay({type:"Top-up",title:t[0],price:t[1],ffuid:uid})}
  else openPay({type:"Unban Appeal",title:"ID Unban Appeal",price:APPEAL_PRICE,ffuid:uid});
 }
 else if(a==="close")closePay();
 else if(a==="send"){
  const f=$("#proof").files[0];
  if(!f){toast("Upload your payment screenshot");return}
  if(f.size>3*1024*1024){toast("Image must be under 3 MB");return}
  b.disabled=true;b.textContent="Sending...";
  const proof=await shrink(f);
  await addDoc(collection(db,"orders"),{uid:S.user.uid,email:S.user.email,...S.pay,proof,status:"pending",createdAt:serverTimestamp()});
  closePay();toast("Proof sent. We will confirm soon.");location.hash="#orders";
 }
 else if(a==="review"){
  const text=$("#rx").value.trim();if(!S.user){toast("Log in first");return}if(!text){toast("Write something first");return}
  await addDoc(collection(db,"reviews"),{uid:S.user.uid,name:S.user.displayName||"Customer",rating:+$("#rt").value,text,createdAt:serverTimestamp()});
  toast("Review posted");
 }
 else if(isAdmin()){
  if(a==="addid"){const name=$("#an").value.trim(),price=+$("#ap").value;if(!name||!price){toast("Enter name and price");return}
   await addDoc(collection(db,"ids"),{name,price,tier:$("#at").value,stock:true});}
  else if(a==="seed"){const n=[["NG ZENOX",2999],["NG CYBER",3299],["NG WIZARD",3499],["NG ELITE",3799],["NG KILLER",3999],["NG HUNTER",4299],["NG FLASH",4599],["NG MAFIA",4999]];
   for(const x of n)await addDoc(collection(db,"ids"),{name:x[0],price:x[1],tier:"normal",stock:true});}
  else if(a==="stock"){const x=S.ids.find(i=>i.id===d.id);await updateDoc(doc(db,"ids",d.id),{stock:!x.stock})}
  else if(a==="del"){if(confirm("Delete this ID?"))await deleteDoc(doc(db,"ids",d.id))}
  else if(a==="status")await updateDoc(doc(db,"orders",d.id),{status:d.s});
 }
 }catch(err){console.error(err);toast("Something went wrong. Try again.")}
});
render();
</script>
</body></html>
